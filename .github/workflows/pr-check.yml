# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: PR build check

on:
  pull_request_target: # Loads this workflow file from the base branch (e.g. main)
    types: [opened, synchronize, reopened]

permissions:
  contents: read



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false





jobs:
  gradle:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      
      - name: Gradle Compile
        run: ./gradlew clean compileKotlin

      - name: Wait for Postgres to be ready
        run: |
            # Service container is reachable at localhost:5432 on GitHub-hosted runner
            for i in $(seq 1 30); do
              pg_isready -h localhost -p 5432 -U testuser && break
              echo "Waiting for postgres..."
              sleep 2
            done
        env:
          PGPASSWORD: testpass

      - name: Run Tests with SonarQube Analysis
        run: ./gradlew test sonar --info
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      
      - name: Gradle Build
        run: |
          ./gradlew clean build -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          platforms: linux/arm64
          tags: |
            dwp-auth-service:${{ github.sha }}
          # Optional: use GitHub Actions cache for build layers (fast incremental builds)
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'dwp-auth-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1'          # Fails the pipeline if vulnerabilities are found
          ignore-unfixed: true     # Optional: ignore CVEs without an available fix
          severity: 'CRITICAL,HIGH'


          