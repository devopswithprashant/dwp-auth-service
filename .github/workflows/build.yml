# This workflow will build a package using Maven and then publish it

name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write 



concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false






env:
  # Set defaults here or as repository/organization variables (recommended)
  AWS_REGION: us-east-1           # <- change to your region or set as repo variable
  AWS_ACCOUNT_ID: 850756192530      # <- change to your AWS account id or set as repo var
  ECR_REPOSITORY: dwp/np/auth            # <- change to your ECR repository name
  GIT_USER_NAME: "ci-bot"
  GIT_USER_EMAIL: "ci-bot@devopswithprashant.com"
  #GITOPS_BRANCH_NAME: ""  # <- change to your gitops branch name or set as repo variable




jobs:
  gradle:
    if: ${{ !startsWith(github.event.head_commit.message, '[Gradle Release Plugin]') }}
    runs-on: ubuntu-latest
    outputs:
      projectVersion: ${{ steps.project_version.outputs.version }}
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: testdb
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
        options: >-
          --health-cmd "pg_isready -U testuser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract Gradle Project Version
        id: project_version
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}' || ./gradlew properties -q | grep "^version:" | cut -d' ' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Gradle Compile
        run: ./gradlew clean compileKotlin

      - name: Wait for Postgres to be ready
        run: |
            # Service container is reachable at localhost:5432 on GitHub-hosted runner
            for i in $(seq 1 30); do
              pg_isready -h localhost -p 5432 -U testuser && break
              echo "Waiting for postgres..."
              sleep 2
            done
        env:
          PGPASSWORD: testpass

      - name: Run Tests
        run: ./gradlew test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/testdb
          SPRING_DATASOURCE_USERNAME: testuser
          SPRING_DATASOURCE_PASSWORD: testpass
      
      - name: Gradle Build
        run: |
          ./gradlew clean build -x test
      
      - name: Upload build artifact (build/libs/)
        uses: actions/upload-artifact@v6
        with:
          name: build-libs
          path: |
              build/libs/*.jar
              !build/libs/*-plain.jar




  docker:
    if: ${{ !startsWith(github.event.head_commit.message, '[Gradle Release Plugin]') }}
    runs-on: ubuntu-latest
    needs: gradle
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ECR_NONPROD_PUSH_ROLE }}  # or use a secret: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActionsECR
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        # amazon-ecr-login uses current AWS credentials and logs docker to ECR

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # in docker job (download step)
      - name: Download build artifact (target/)
        uses: actions/download-artifact@v4
        with:
          name: build-libs
          path: build/libs     # <--- downloads artifact contents into ./target

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:latest
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${{ needs.gradle.outputs.projectVersion }}-${{ github.sha }}
          # Optional: use GitHub Actions cache for build layers (fast incremental builds)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  
