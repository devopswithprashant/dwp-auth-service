name: "Release Create"

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: 'Next development version (e.g., 1.2.0-SNAPSHOT). Leave empty to auto-increment patch.'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  GHEC_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}



jobs:
  create-release:
    runs-on: ubuntu-latest
    # Enforce execution context exclusively on the main branch
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Main Branch HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so the plugin can read previous tags
          token: ${{ secrets.GH_AUTOMATION_TOKEN }} # Using a PAT allows the pushed tag to trigger your Publish workflow


      - name: Execute Gradle Release Plugin
        run: |
          # Setup Git User configs
          git config user.email "devopswithprashant@gmail.com"
          git config user.name "devopswithprashant"

          # Use automatic versioning mode to handle the release and next dev versions headless
          RELEASE_OPTS="-Pgradle.release.useAutomaticVersion=true"
          
          # Override the next development version if explicitly provided by the user
          if [ -n "${{ github.event.inputs.next_version }}" ]; then
            RELEASE_OPTS="$RELEASE_OPTS -PnewVersion=${{ github.event.inputs.next_version }}"
          fi
          
          echo "Running gradle release plugin against HEAD..."
          ./gradlew release $RELEASE_OPTS

