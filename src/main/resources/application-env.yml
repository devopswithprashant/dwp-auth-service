spring:

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

logging:
  level:
    root: INFO

jwt:
  issuer: ${JWT_ISSUER}
  audience: ${JWT_AUDIENCE}
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY}

user-profile:
  grpc-target: ${USER_PROFILE_GRPC_TARGET}
  deadline: ${USER_PROFILE_GRPC_DEADLINE}
  poll-interval: ${USER_PROFILE_POLL_INTERVAL}
  retry-initial-backoff: ${USER_PROFILE_RETRY_INITIAL_BACKOFF}
  retry-max-backoff: ${USER_PROFILE_RETRY_MAX_BACKOFF}
  retry-max-attempts: ${USER_PROFILE_RETRY_MAX_ATTEMPTS}
  lease-duration: ${USER_PROFILE_LEASE_DURATION}