server:
  port: 8081

spring:
  application:
    name: auth

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    locations:
      - classpath:db/migration

logging:
  level:
    org.flywaydb: INFO

jwt:
  issuer: ${JWT_ISSUER:devopswithprashant-auth}
  audience: ${JWT_AUDIENCE:devopswithprashant-platform}
  secret: ${JWT_SECRET}
  access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:3600}

user-profile:
  grpc-target: ${USER_PROFILE_GRPC_TARGET:localhost:9090}
  deadline: ${USER_PROFILE_GRPC_DEADLINE:3s}
  poll-interval: ${USER_PROFILE_POLL_INTERVAL:1s}
  retry-initial-backoff: ${USER_PROFILE_RETRY_INITIAL_BACKOFF:5s}
  retry-max-backoff: ${USER_PROFILE_RETRY_MAX_BACKOFF:15m}
  retry-max-attempts: ${USER_PROFILE_RETRY_MAX_ATTEMPTS:10}
  lease-duration: ${USER_PROFILE_LEASE_DURATION:10s}